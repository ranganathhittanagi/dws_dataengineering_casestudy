name: Deploy to EC2

# Deploys the latest master to both Airflow EC2 instances via SSM Run Command
# (no SSH, no inbound ports): git pull + docker compose up on each node.
# The control node runs the complete Airflow stack; the dev node receives the same
# repository revision for ad hoc development and dbt work.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1

concurrency:
  group: deploy-to-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start EC2 instances
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=airflow-control,dev-ec2-instance" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          test -n "$INSTANCE_IDS"
          STOPPING_IDS=$(aws ec2 describe-instances --instance-ids $INSTANCE_IDS \
            --filters "Name=instance-state-name,Values=stopping" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$STOPPING_IDS" ]; then
            aws ec2 wait instance-stopped --instance-ids $STOPPING_IDS
          fi
          STOPPED_IDS=$(aws ec2 describe-instances --instance-ids $INSTANCE_IDS \
            --filters "Name=instance-state-name,Values=stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$STOPPED_IDS" ]; then
            aws ec2 start-instances --instance-ids $STOPPED_IDS >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids $INSTANCE_IDS
          echo "INSTANCE_IDS=$INSTANCE_IDS" >> "$GITHUB_ENV"

      - name: Wait for SSM
        run: |
          for INSTANCE_ID in $INSTANCE_IDS; do
            for i in $(seq 1 30); do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text)
              if [ "$STATUS" = "Online" ]; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "SSM did not become ready for $INSTANCE_ID"
                exit 1
              fi
              sleep 10
            done
          done

      - name: Deploy control plane
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=airflow-control" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7} to control" \
            --parameters 'commands=["set -euxo pipefail","cloud-init status --wait || true","cd /opt/app","git fetch origin master","git checkout master","git reset --hard origin/master","export AWS_REGION=ap-south-1","bash deploy/fetch_runtime_env.sh control","docker compose -f deploy/docker-compose.control.yml up -d --build"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            if [ "$i" -eq 90 ]; then
              echo "Deployment timed out"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
              exit 1
            fi
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

      - name: Deploy dev instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=dev-ec2-instance" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [[ ! "$INSTANCE_ID" =~ ^i-[a-z0-9]{8,17}$ ]]; then
            echo "No dev-ec2-instance found; got: $INSTANCE_ID"
            exit 1
          fi
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [ "$STATE" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE=stopped
          fi
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" >/dev/null
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          for i in $(seq 1 30); do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            [ "$SSM_STATUS" = "Online" ] && break
            if [ "$i" -eq 30 ]; then
              echo "SSM did not become ready for $INSTANCE_ID"
              exit 1
            fi
            sleep 10
          done
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7} to dev" \
            --parameters 'commands=["set -euxo pipefail","cloud-init status --wait || true","cd /opt/app","git fetch origin master","git checkout master","git reset --hard origin/master","export AWS_REGION=ap-south-1","bash deploy/fetch_runtime_env.sh dev","docker compose -f deploy/docker-compose.dev.yml down --remove-orphans","docker compose -f deploy/docker-compose.dev.yml up -d --build"]' \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            if [ "$i" -eq 90 ]; then
              echo "Deployment timed out"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
              exit 1
            fi
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'
