name: dbt CI

on:
  pull_request:
    branches: [master]
  workflow_call:

env:
  AWS_REGION: ap-south-1

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dbt
        run: pip install dbt-snowflake==1.8.3

      - name: Load non-sensitive Snowflake settings
        run: grep -E '^(SNOWFLAKE_|S3_)' .env >> "$GITHUB_ENV"

      - name: Load Snowflake private key from SSM
        run: |
          PRIVATE_KEY=$(aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "/dws/snowflake/dws-service-user/private_key" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          {
            echo "SNOWFLAKE_PRIVATE_KEY<<EOF"
            echo "$PRIVATE_KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: dbt deps
        working-directory: ./dbt
        run: dbt deps

      - name: dbt parse
        working-directory: ./dbt
        run: dbt parse

      - name: dbt docs generate
        working-directory: ./dbt
        run: dbt docs generate
