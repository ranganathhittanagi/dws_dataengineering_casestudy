# dev-ec2-instance: runs the Celery worker that executes the DAG's ingestion and dbt
# tasks, and doubles as the box you SSM into for ad hoc manual work. Connects to
# Postgres/Redis on the control instance; its address and all credentials come from
# deploy/runtime.env (generated by deploy/fetch_runtime_env.sh via the instance's IAM
# role). Run from the repo root:
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
#
# For ad hoc commands against the same image/env (e.g. a manual dbt run or a Python
# shell), reuse the running container:
#   docker compose -f deploy/docker-compose.dev.yml exec airflow-worker bash

x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: "${AWS_REGION:-ap-south-1}"
    awslogs-group: /dws-airflow/containers
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  airflow-worker:
    image: dws_etl_service_container
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    command: airflow celery worker
    env_file:
      - runtime.env
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_HOME: /opt/home/airflow
      PYTHONPATH: /opt/home
      DBT_PROFILES_DIR: /opt/home/dbt
      DBT_LOG_PATH: /opt/home/dbt/logs
      DBT_TARGET_PATH: /opt/home/dbt/target
      AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "extra": {"region_name": "${AWS_REGION:-ap-south-1}"}}'
    volumes:
      - ../airflow/dags:/opt/home/airflow/dags
      - ../airflow/plugins:/opt/home/airflow/plugins
      - ../src:/opt/home/src
      - ../dbt:/opt/home/dbt
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME} || celery --app airflow.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    logging: *awslogs
    restart: always
