x-airflow-common:
  &airflow-common
  image: dws_etl_service_container
  build:
    context: .
    dockerfile: ./airflow/Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW_HOME: /opt/home/airflow
    PYTHONPATH: /opt/home
    DBT_PROFILES_DIR: /opt/home/dbt
    DBT_LOG_PATH: /opt/home/dbt/logs
    DBT_TARGET_PATH: /opt/home/dbt/target
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
    # The RSA key pair is read at runtime from SSM Parameter Store; never stored here.
    SNOWFLAKE_PARAM_PATH: ${SNOWFLAKE_PARAM_PATH:-/dws/snowflake/dws-service-user}
    S3_BUCKET: ${S3_BUCKET:-trades-source-dws}
    S3_PREFIX: ${S3_PREFIX:-raw/trades}
    AWS_REGION: ${AWS_REGION:-ap-south-1}
    AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
    AWS_PROFILE: ${AWS_PROFILE:-dws-pipeline}
    AWS_SHARED_CREDENTIALS_FILE: /opt/home/.aws/credentials
    AWS_CONFIG_FILE: /opt/home/.aws/config
    _AIRFLOW_WWW_USER_PASSWORD: admin
    # Failure alerts publish to SNS (topic managed in terraform/sns.tf).
    SNS_ALERT_TOPIC_ARN: ${SNS_ALERT_TOPIC_ARN}
    # Resolves AWS credentials via the mounted profile / default boto3 chain.
    AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "extra": {"region_name": "${AWS_REGION:-ap-south-1}"}}'
  volumes:
    - ./airflow/dags:/opt/home/airflow/dags
    - airflow-logs:/opt/home/airflow/logs
    - ./airflow/plugins:/opt/home/airflow/plugins
    - ./src:/opt/home/src
    - ./dbt:/opt/home/dbt
    - dbt-logs:/opt/home/dbt/logs
    - dbt-target:/opt/home/dbt/target
    - ./data:/opt/home/data
    # Local AWS credentials for development only; replaced by an IAM role on AWS compute.
    - ${HOME}/.aws:/opt/home/.aws:ro
  depends_on:
    postgres:
      condition: service_healthy

volumes:
  airflow-logs:
  dbt-logs:
  dbt-target:

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  dws_etl_service_container:
    <<: *airflow-common
    container_name: dws_etl_service_container
    hostname: dws_etl
    user: "0:0"
    working_dir: /opt/home
    environment:
      <<: *airflow-common-env
      PS1: "dws_etl@\\h:\\w\\$ "
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
        airflow scheduler &
        airflow triggerer &
        exec airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
