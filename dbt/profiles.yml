trade_data:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('DBT_TARGET_DATABASE', 'RAW_DB') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('DBT_TARGET_SCHEMA', 'RAW_SCHEMA') }}"
      # PEM injected at runtime from AWS SSM Parameter Store (see src/config.dbt_environment).
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      threads: 2
      client_session_keep_alive: false
