name: dbt CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  DBT_TARGET_PATH: ${{ github.workspace }}/dbt/target
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_PARAM_PATH: ${{ vars.SNOWFLAKE_PARAM_PATH || '/dws/snowflake/dws-service-user' }}

jobs:
  dbt-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --no-cache-dir -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # profiles.yml reads the PEM from SNOWFLAKE_PRIVATE_KEY; nothing is written to disk.
      - name: Load private key from SSM Parameter Store
        run: |
          {
            echo 'SNOWFLAKE_PRIVATE_KEY<<PEM_EOF'
            aws ssm get-parameter \
              --name "${SNOWFLAKE_PARAM_PATH}/private_key" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text
            echo 'PEM_EOF'
          } >> "$GITHUB_ENV"

      - name: dbt deps
        working-directory: ./dbt
        run: |
          . ../.venv/bin/activate
          dbt deps

      - name: dbt parse
        working-directory: ./dbt
        run: |
          . ../.venv/bin/activate
          dbt parse --vars '{"etl_date": "2024-01-01"}'

      - name: dbt compile
        working-directory: ./dbt
        run: |
          . ../.venv/bin/activate
          dbt compile --vars '{"etl_date": "2024-01-01"}'

      - name: dbt test
        working-directory: ./dbt
        run: |
          . ../.venv/bin/activate
          dbt test --vars '{"etl_date": "2024-01-01"}'
