# dev-ec2-instance: persistent development shell for ad hoc dbt, Python, AWS CLI,
# and repository operations. Airflow services and task execution run on airflow-control.
# Run from the repo root:
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
# Enter the development container:
#   docker compose -f deploy/docker-compose.dev.yml exec dev-shell bash

x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: "${AWS_REGION:-ap-south-1}"
    awslogs-group: /dws-airflow/containers
    awslogs-create-group: "true"
    tag: "{{.Name}}"

services:
  dev-shell:
    image: dws_etl_service_container
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    command: sleep infinity
    env_file:
      - runtime.env
    environment:
      AIRFLOW_HOME: /opt/home/airflow
      PYTHONPATH: /opt/home
      DBT_PROFILES_DIR: /opt/home/dbt
      DBT_LOG_PATH: /opt/home/dbt/logs
      DBT_TARGET_PATH: /opt/home/dbt/target
      AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "extra": {"region_name": "${AWS_REGION:-ap-south-1}"}}'
    volumes:
      - ../airflow/dags:/opt/home/airflow/dags
      - ../airflow/plugins:/opt/home/airflow/plugins
      - ../src:/opt/home/src
      - ../dbt:/opt/home/dbt
    logging: *awslogs
    restart: always
