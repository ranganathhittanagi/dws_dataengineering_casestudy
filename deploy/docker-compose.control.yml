# Airflow control plane (EC2 "airflow-control"): metadata Postgres, Redis broker,
# webserver, scheduler, triggerer, and Celery worker. Run from the repo root:
#   docker compose -f deploy/docker-compose.control.yml up -d --build
#
# Secrets (Fernet key, DB/Redis passwords, connection strings) come from
# deploy/runtime.env, generated at boot/deploy time by deploy/fetch_runtime_env.sh
# using the instance's IAM role. No static AWS credentials anywhere.

x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: "${AWS_REGION:-ap-south-1}"
    awslogs-group: /dws-airflow/containers
    awslogs-create-group: "true"
    tag: "{{.Name}}"

x-airflow-common:
  &airflow-common
  image: dws_etl_service_container
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  env_file:
    - runtime.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__WEBSERVER__WORKERS: 1
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
    AIRFLOW_HOME: /opt/home/airflow
    PYTHONDONTWRITEBYTECODE: '1'
    PYTHONPATH: /opt/home
    DBT_PROFILES_DIR: /opt/home/dbt
    DBT_LOG_PATH: /opt/home/dbt_logs
    DBT_TARGET_PATH: /opt/home/dbt_target
    AIRFLOW_CONN_AWS_DEFAULT: '{"conn_type": "aws", "extra": {"region_name": "${AWS_REGION:-ap-south-1}"}}'
  volumes:
    - ../airflow/dags:/opt/home/airflow/dags
    - ../airflow/plugins:/opt/home/airflow/plugins
    - ../src:/opt/home/src
    - ../dbt:/opt/home/dbt
  logging: *awslogs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
    env_file:
      - runtime.env
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    logging: *awslogs
    restart: always

  redis:
    image: redis:7
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    env_file:
      - runtime.env
    volumes:
      - /data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 5
      start_period: 5s
    logging: *awslogs
    restart: always

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        /opt/home/dbt_venv/bin/dbt deps --project-dir /opt/home/dbt
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-triggerer:
    <<: *airflow-common
    command: airflow triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-worker:
    <<: *airflow-common
    command: airflow celery worker --concurrency 1
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME} || celery --app airflow.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
