name: trade_data
version: '1.0.0'
config-version: 2

profile: trade_data

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

packages-install-path: dbt_packages

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  dq_observability_schema: "DQ_OBSERVABILITY"

flags:
  require_explicit_package_overrides_for_builtin_materializations: false
  source_freshness_run_project_hooks: true

on-run-end:
  - '{{ elementary.upload_dbt_artifacts(results) }}'

models:
  trade_data:
    +grants:
      select: ["{{ env_var('SNOWFLAKE_ROLE') }}", "ACCOUNTADMIN"]
      insert: ["{{ env_var('SNOWFLAKE_ROLE') }}", "ACCOUNTADMIN"]
      update: ["{{ env_var('SNOWFLAKE_ROLE') }}", "ACCOUNTADMIN"]
      delete: ["{{ env_var('SNOWFLAKE_ROLE') }}", "ACCOUNTADMIN"]
    raw:
      +materialized: copy_into_table
      +database: RAW_DB
      +schema: RAW_SCHEMA
      +tags: ["ingest"]
    transform:
      +materialized: incremental
      +database: TRANSFORM_DB
      +schema: TRANSFORM_SCHEMA
      +tags: ["prepare_quality"]
    datawarehouse:
      +materialized: incremental
      +database: DATAWAREHOUSE_DB
      +schema: DATAWAREHOUSE_SCHEMA
    compliance:
      +materialized: incremental
      +database: COMPLIANCE_DB
      +schema: COMPLIANCE_SCHEMA
      +tags: ["prepare_quality"]
    quality:
      +materialized: incremental
      +database: COMPLIANCE_DB
      +schema: DQ_OBSERVABILITY
      +tags: ["post_publish_audit"]
  elementary:
    +database: COMPLIANCE_DB
    +schema: DQ_OBSERVABILITY

seeds:
  trade_data:
    +database: COMPLIANCE_DB
    +schema: COMPLIANCE_SCHEMA
