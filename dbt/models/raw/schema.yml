version: 2

models:
  - name: trades
    description: |
      Bronze layer - raw trades loaded straight from the CSV stage. The custom
      `copy_into_table` materialization scans the CSV header at runtime, so any
      new columns that appear after the known seven are created as separate
      Snowflake columns named after their header. Extra columns are retained here
      in bronze and are not promoted to silver. The seven known columns and
      lineage metadata are always present.
    columns:
      - name: TRADE_ID
        description: "Trade identifier (string)"
      - name: VERSION
        description: "Trade version (string)"
      - name: COUNTERPARTY
        description: "Counterparty name (string)"
      - name: NOTIONAL
        description: "Notional amount (string)"
      - name: CURRENCY
        description: "Currency code (string)"
      - name: MATURITY_DATE
        description: "Maturity date (string)"
      - name: EXECUTION_DATE
        description: "Execution date (string)"
      - name: SOURCE_FILENAME
        description: "Full source file path from the stage"
        tests:
          - not_null
      - name: SOURCE_ROW_NUMBER
        description: "Row number within the source file"
      - name: ETL_DATE
        description: "The etl_date batch this row was loaded for"
        tests:
          - not_null
      - name: DBT_INVOCATION_ID
        description: "dbt invocation/run identifier for lineage"
      - name: LOAD_TIMESTAMP
        description: "When the row was loaded into Snowflake"
        tests:
          - not_null
